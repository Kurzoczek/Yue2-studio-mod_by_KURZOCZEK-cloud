name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in tauri.conf.json and the v-prefixed release tag"
        required: true
        default: "5.0.0"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Install the pinned Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.363.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install the pinned Vulkan SDK.'
          }
          $sdk = 'C:\VulkanSDK\1.4.363.1'
          if (-not (Test-Path (Join-Path $sdk 'Include\vulkan\vulkan.h')) -or -not (Test-Path (Join-Path $sdk 'Bin\glslc.exe'))) {
            throw "The Vulkan SDK installation is incomplete at $sdk."
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Install interface and Tauri dependencies
        shell: pwsh
        run: |
          npm ci --prefix app --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed in app.' }
          npm ci --prefix desktop --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed in desktop.' }
      - name: Build, test, and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          YUE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: .\scripts\build-release.ps1 -Version "${{ inputs.version }}" -RuntimeBackend vulkan
      - name: Upload signed release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          $directory = "release\${{ inputs.version }}"
          $assets = Get-ChildItem -LiteralPath $directory -File
          if (-not $assets -or -not ($assets.Name -match '\.exe$')) {
            throw "No Windows installer was produced in $directory."
          }
          gh release upload $tag $assets.FullName --repo $env:GITHUB_REPOSITORY --clobber
